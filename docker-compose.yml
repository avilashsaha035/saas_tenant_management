version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - saas_network
    depends_on:
      - mysql
      - redis

  webserver:
    image: nginx:alpine
    container_name: saas_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - saas_network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: saas_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: saas_tenant_management
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - saas_dbdata:/var/lib/mysql
    networks:
      - saas_network

  redis:
    image: redis:alpine
    container_name: saas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - saas_redisdata:/data
    networks:
      - saas_network

  queue_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas_queue_worker
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./:/var/www
    networks:
      - saas_network
    depends_on:
      - app
      - mysql
      - redis

networks:
  saas_network:
    driver: bridge

volumes:
  saas_dbdata:
    driver: local
  saas_redisdata:
    driver: local
